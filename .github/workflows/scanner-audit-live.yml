name: Scanner audit live validation
on:
  push:
    branches: ['codex/scanner-integrity-2026-09-29']
permissions:
  contents: read
concurrency:
  group: run-stock-scanner
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      MASSIVE_API_KEY: ${{ secrets.MASSIVE_API_KEY }}
      ALPHAVANTAGE_API_KEY: ${{ secrets.ALPHAVANTAGE_API_KEY }}
      MBOUM_API_KEY: ${{ secrets.MBOUM_API_KEY }}
      MBOUM_OPTIONS_KEY: ${{ secrets.MBOUM_OPTIONS_KEY }}
      TWELVEDATA_API_KEY: ${{ secrets.TWELVEDATA_API_KEY }}
      FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
      SCAN_BUDGET_MINUTES: '35'
      LOG_LEVEL: INFO
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -v -p 'test_*.py'
      - name: Run full live CLI
        run: python new_stock_scanner_pipeline_claude_opus_41426.py
      - name: Validate strict JSON and print summary
        if: always()
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          import subprocess
          reports = sorted(Path('scan_results').glob('*.json'), key=lambda p: p.stat().st_mtime)
          if not reports:
              raise SystemExit('No scan report produced')
          def reject_constant(value):
              raise ValueError('Nonstandard numeric literal: ' + value)
          report = json.loads(reports[-1].read_text(), parse_constant=reject_constant)
          assert report.get('engine_version') == '6.1.0', report.get('engine_version')
          assert report.get('report_kind') in {'scan', 'no_action'}, report.get('reason')
          coverage = report['scan_diagnostics']['data_coverage']['full_history']
          assert coverage['complete']
          assert coverage['attempted'] == coverage['requested']
          assert coverage['loaded'] + coverage['unavailable'] == coverage['requested']
          assert len(coverage['unavailable_tickers']) == coverage['unavailable']
          assert coverage['coverage_ratio'] >= coverage['minimum_coverage_ratio']
          assert abs(coverage['coverage_ratio'] - coverage['loaded'] / coverage['requested']) < 0.000001
          diagnostics = report['scan_diagnostics']
          assert len(diagnostics['execution_guard_rejected_tickers']) + report['stage_counts']['Stage 2: Passed Guards'] + len(diagnostics['technical_calculation_failures']) == coverage['loaded']
          if report['report_kind'] == 'no_action':
              assert report['total_survivors'] == 0
              assert all(row['rules_passed'] < 10 for row in report['near_misses'])
          print('Validated report:', reports[-1])
          subprocess.run(['python', '.github/scripts/summarize_scan.py', str(reports[-1])], check=True)
          PY
      - name: Check live enrichment schemas without promoting near misses
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import new_stock_scanner_pipeline_claude_opus_41426 as scanner
          report = json.loads(max(Path('scan_results').glob('*.json'), key=lambda p: p.stat().st_mtime).read_text())
          rows = report.get('top_25') or report.get('near_misses') or []
          tickers = [row['ticker'] for row in rows[:3]]
          fundamentals = scanner.FundamentalsFetcher(scanner.MASSIVE_API_KEY).fetch_batch(tickers)
          for ticker in tickers:
              fund = fundamentals.get(ticker) or {}
              print(ticker, 'fundamentals:', fund.get('fundamentals_quality'), fund.get('fundamentals_sources'))
              for provider, fetch_chain in [('MBOUM', scanner.OptionsEvaluator._fetch_chain_mboum), ('Massive', scanner.OptionsEvaluator._fetch_chain_massive)]:
                  try:
                      contracts = fetch_chain(ticker)
                  except scanner.ProviderExhausted:
                      print(ticker, provider, 'provider unavailable; fallback remains permitted')
                      contracts = []
                  assert isinstance(contracts, list)
                  auditable = sum(bool(scanner.OptionsEvaluator._quote_context(contract)['valid']) for contract in contracts)
                  print(ticker, provider, 'parsed contracts:', len(contracts), 'auditable quote contexts:', auditable)
          print('Compatibility diagnostics only; no rule overrides, recommendations, or trades.')
          PY
      - uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: scanner-audit-live-results
          path: |
            scan_pipeline.log
            scan_results/
          retention-days: 14
