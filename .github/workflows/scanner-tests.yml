name: Scanner regression checks
on:
  pull_request:
  push:
    branches: [main, 'codex/**']
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m py_compile new_stock_scanner_pipeline_claude_opus_41426.py .github/scripts/summarize_scan.py
      - run: python -m unittest discover -v -p 'test_*.py'
