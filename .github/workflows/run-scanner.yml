name: Run Stock Scanner

on:
  schedule:
    # Weekdays at 08:45 ET. GitHub cron is UTC, so trigger both DST and
    # standard-time candidates and let the first step skip the off-hour one.
    - cron: "45 12 * * 1-5"
    - cron: "45 13 * * 1-5"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: run-stock-scanner
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Confirm scheduled ET scan window
        id: schedule_window
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" != "schedule" ]]; then
            echo "run_scan=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          et_hour="$(TZ=America/New_York date +%H)"
          if [[ "$et_hour" == "08" ]]; then
            echo "run_scan=true" >> "$GITHUB_OUTPUT"
          else
            echo "run_scan=false" >> "$GITHUB_OUTPUT"
            echo "Skipping duplicate UTC schedule; current ET hour is ${et_hour}."
          fi

      - name: Check out repository
        if: steps.schedule_window.outputs.run_scan == 'true'
        uses: actions/checkout@v4

      - name: Set up Python
        if: steps.schedule_window.outputs.run_scan == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        if: steps.schedule_window.outputs.run_scan == 'true'
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run scanner regression tests
        if: steps.schedule_window.outputs.run_scan == 'true'
        run: python -m unittest -v

      - name: Run live stock scanner
        if: steps.schedule_window.outputs.run_scan == 'true'
        env:
          MASSIVE_API_KEY: ${{ secrets.MASSIVE_API_KEY }}
          ALPHAVANTAGE_API_KEY: ${{ secrets.ALPHAVANTAGE_API_KEY }}
          MBOUM_API_KEY: ${{ secrets.MBOUM_API_KEY }}
          MBOUM_OPTIONS_KEY: ${{ secrets.MBOUM_OPTIONS_KEY }}
        run: python new_stock_scanner_pipeline_claude_opus_41426.py

      - name: Upload scan outputs
        if: always() && steps.schedule_window.outputs.run_scan == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: stock-scan-results
          path: |
            scan_pipeline.log
            scan_results/
          if-no-files-found: ignore
          retention-days: 14
