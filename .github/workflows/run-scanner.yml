name: Run Stock Scanner

on:
  schedule:
    # Weekdays at 08:45 ET. GitHub cron is UTC, so trigger both DST and
    # standard-time candidates and let the first step skip the off-hour one.
    - cron: "45 12 * * 1-5"
    - cron: "45 13 * * 1-5"
  workflow_dispatch:
    inputs:
      run_tests:
        description: "Run the regression tests before scanning"
        type: boolean
        default: true
      scan_budget_minutes:
        description: "Wall-clock budget for the scan (minutes, must be < job timeout)"
        type: string
        default: "100"
      log_level:
        description: "Log verbosity"
        type: choice
        default: "INFO"
        options:
          - INFO
          - DEBUG

permissions:
  contents: read

concurrency:
  group: run-stock-scanner
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Confirm scheduled ET scan window
        id: schedule_window
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" != "schedule" ]]; then
            # Manual (workflow_dispatch) runs always execute immediately.
            echo "run_scan=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Use github.event.schedule (immutable – set when the job was queued)
          # together with the current ET UTC offset to decide which cron
          # corresponds to 08:45 ET, regardless of how late the job starts.
          et_offset="$(TZ=America/New_York date +%z)"
          if [[ "$et_offset" == "-0400" ]]; then
            expected_schedule="45 12 * * 1-5"   # EDT: 08:45 ET = 12:45 UTC
          else
            expected_schedule="45 13 * * 1-5"   # EST: 08:45 ET = 13:45 UTC
          fi

          triggered_schedule="${{ github.event.schedule }}"
          if [[ "$triggered_schedule" == "$expected_schedule" ]]; then
            echo "run_scan=true" >> "$GITHUB_OUTPUT"
          else
            echo "run_scan=false" >> "$GITHUB_OUTPUT"
            echo "Skipping off-season schedule '${triggered_schedule}'; expected '${expected_schedule}' for ET offset ${et_offset}."
          fi

      - name: Check out repository
        if: steps.schedule_window.outputs.run_scan == 'true'
        uses: actions/checkout@v4

      - name: Set up Python
        if: steps.schedule_window.outputs.run_scan == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        if: steps.schedule_window.outputs.run_scan == 'true'
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Report engine version
        id: engine
        if: steps.schedule_window.outputs.run_scan == 'true'
        shell: bash
        run: |
          # Read the identity straight out of the scanner so a manual run can
          # never silently execute an older engine than the checked-out code.
          engine="$(python -c 'import new_stock_scanner_pipeline_claude_opus_41426 as s; print(f"{s.ENGINE_NAME} v{s.ENGINE_VERSION}")')"
          echo "Engine: ${engine}"
          {
            echo "## ${engine}"
            echo ""
            echo "- Trigger: \`${{ github.event_name }}\`"
            echo "- Commit: \`${{ github.sha }}\`"
            echo "- Ref: \`${{ github.ref_name }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Verify API credentials
        if: steps.schedule_window.outputs.run_scan == 'true'
        shell: bash
        env:
          MASSIVE_API_KEY: ${{ secrets.MASSIVE_API_KEY }}
          MBOUM_API_KEY: ${{ secrets.MBOUM_API_KEY }}
          MBOUM_OPTIONS_KEY: ${{ secrets.MBOUM_OPTIONS_KEY }}
          TWELVEDATA_API_KEY: ${{ secrets.TWELVEDATA_API_KEY }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
        run: |
          # Fail in seconds with an actionable message instead of burning the
          # whole job on requests that are all going to be rejected.
          if [[ -z "$MASSIVE_API_KEY" ]]; then
            echo "::notice::MASSIVE_API_KEY secret is empty; the engine will use its committed fallback key."
          fi
          if [[ -z "$MBOUM_API_KEY" ]]; then
            echo "::warning::MBOUM_API_KEY is not set; OHLCV/fundamentals will fall back to Massive/TwelveData/Finnhub/Yahoo. MBOUM remains primary when the key and credits are available."
          fi
          if [[ -z "$MBOUM_OPTIONS_KEY" ]]; then
            echo "::warning::MBOUM_OPTIONS_KEY is not set; options chains will fall back to Massive/Yahoo."
          fi
          if [[ -z "$TWELVEDATA_API_KEY" ]]; then
            echo "::notice::TWELVEDATA_API_KEY secret is empty; the engine will use its committed fallback key."
          fi
          if [[ -z "$FINNHUB_API_KEY" ]]; then
            echo "::notice::FINNHUB_API_KEY secret is empty; the engine will use its committed fallback key."
          fi
          echo "Credential check complete. MBOUM is primary when credits remain."

      - name: Run scanner regression tests
        if: >-
          steps.schedule_window.outputs.run_scan == 'true' &&
          (github.event_name != 'workflow_dispatch' || inputs.run_tests)
        run: python -m unittest -v

      - name: Run live stock scanner
        if: steps.schedule_window.outputs.run_scan == 'true'
        env:
          MASSIVE_API_KEY: ${{ secrets.MASSIVE_API_KEY }}
          ALPHAVANTAGE_API_KEY: ${{ secrets.ALPHAVANTAGE_API_KEY }}
          MBOUM_API_KEY: ${{ secrets.MBOUM_API_KEY }}
          MBOUM_OPTIONS_KEY: ${{ secrets.MBOUM_OPTIONS_KEY }}
          TWELVEDATA_API_KEY: ${{ secrets.TWELVEDATA_API_KEY }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          SCAN_BUDGET_MINUTES: ${{ inputs.scan_budget_minutes || '100' }}
          LOG_LEVEL: ${{ inputs.log_level || 'INFO' }}
        run: python new_stock_scanner_pipeline_claude_opus_41426.py

      - name: Publish results summary
        if: always() && steps.schedule_window.outputs.run_scan == 'true'
        shell: bash
        run: |
          latest="$(ls -1t scan_results/scan_*.json 2>/dev/null | head -n 1 || true)"
          if [[ -z "$latest" ]]; then
            echo "No scan report was produced -- see the uploaded log artifact." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          python .github/scripts/summarize_scan.py "$latest" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload scan outputs
        if: always() && steps.schedule_window.outputs.run_scan == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: stock-scan-results
          path: |
            scan_pipeline.log
            scan_results/
          if-no-files-found: ignore
          retention-days: 14
