name: Verify live scanner artifact
on:
  push:
    branches: ['codex/scanner-integrity-2026-09-29']
permissions:
  contents: read
  actions: read
concurrency:
  group: run-stock-scanner
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      AUDIT_RUN_ID: '36729696319'
      AUDIT_CODE_SHA: '4962d50582671be9229737b9044445a7c3ebaa0b'
      MASSIVE_API_KEY: ${{ secrets.MASSIVE_API_KEY }}
      MBOUM_API_KEY: ${{ secrets.MBOUM_API_KEY }}
      MBOUM_OPTIONS_KEY: ${{ secrets.MBOUM_OPTIONS_KEY }}
      TWELVEDATA_API_KEY: ${{ secrets.TWELVEDATA_API_KEY }}
      FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Download the final live scan artifact
        run: |
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$AUDIT_RUN_ID" > /tmp/scanner-live-run.json
          gh run download "$AUDIT_RUN_ID" --repo "$GITHUB_REPOSITORY" --name scanner-audit-live-results --dir verified-live
      - name: Validate complete CLI execution and auditable coverage
        run: |
          python - <<'PY'
          import json
          import os
          import subprocess
          from pathlib import Path
          run = json.loads(Path('/tmp/scanner-live-run.json').read_text())
          assert run['head_sha'] == os.environ['AUDIT_CODE_SHA']
          reports = sorted(Path('verified-live').rglob('*.json'))
          assert len(reports) == 1, reports
          def reject_constant(value):
              raise ValueError('Nonstandard numeric literal: ' + value)
          report = json.loads(reports[0].read_text(), parse_constant=reject_constant)
          assert report['engine_version'] == '6.1.0'
          assert report['report_kind'] in {'scan', 'no_action'}, report.get('reason')
          diagnostics = report['scan_diagnostics']
          coverage = diagnostics['data_coverage']['full_history']
          assert coverage['complete']
          assert coverage['attempted'] == coverage['requested']
          assert coverage['loaded'] + coverage['unavailable'] == coverage['requested']
          assert len(coverage['unavailable_tickers']) == coverage['unavailable']
          assert coverage['coverage_ratio'] >= coverage['minimum_coverage_ratio']
          assert abs(coverage['coverage_ratio'] - coverage['loaded'] / coverage['requested']) < 0.000001
          assert len(diagnostics['execution_guard_rejected_tickers']) + report['stage_counts']['Stage 2: Passed Guards'] + len(diagnostics['technical_calculation_failures']) == coverage['loaded']
          if report['report_kind'] == 'no_action':
              assert report['total_survivors'] == 0
              assert all(row['rules_passed'] < 10 for row in report['near_misses'])
          print('Verified full live CLI artifact from', run['html_url'])
          print('Coverage gaps remain disclosed:', coverage['unavailable'])
          subprocess.run(['python', '.github/scripts/summarize_scan.py', str(reports[0])], check=True)
          PY
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Check live enrichment schemas without promoting near misses
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import new_stock_scanner_pipeline_claude_opus_41426 as scanner
          report = json.loads(next(Path('verified-live').rglob('*.json')).read_text())
          rows = report.get('top_25') or report.get('near_misses') or []
          tickers = [row['ticker'] for row in rows[:3]]
          assert tickers, 'No discovered names available for enrichment compatibility check'
          fundamentals = scanner.FundamentalsFetcher(scanner.MASSIVE_API_KEY).fetch_batch(tickers)
          for ticker in tickers:
              fund = fundamentals.get(ticker) or {}
              print(ticker, 'fundamentals:', fund.get('fundamentals_quality'), fund.get('fundamentals_sources'))
              chains = {
                  'MBOUM': scanner.OptionsEvaluator._fetch_chain_mboum(ticker),
                  'Massive': scanner.OptionsEvaluator._fetch_chain_massive(ticker),
              }
              for provider, contracts in chains.items():
                  assert isinstance(contracts, list)
                  auditable = sum(bool(scanner.OptionsEvaluator._quote_context(contract)['valid']) for contract in contracts)
                  print(ticker, provider, 'parsed contracts:', len(contracts), 'auditable quote contexts:', auditable)
          print('Compatibility diagnostics only; no rule overrides, recommendations, or trades.')
          PY
